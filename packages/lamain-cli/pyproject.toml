[project]
name = "lamain-cli"
version = "0.1.0"
description = "CLI for La Main: bus, assemble, calibrate, collect-collisions."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "lamain-core[plots]",
    "rustypot>=1.10.0",
]

[project.scripts]
lamain = "lamain_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lamain_cli"]
