[project]
name = "lamain-core"
version = "0.1.0"
description = "Core library for La Main: bus, model, calibration, safety, controller."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "rustypot>=1.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lamain_core"]
