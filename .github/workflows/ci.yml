name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync workspace
        run: uv sync
      - name: Run tests (FakeBus, sans materiel)
        run: uv run pytest
