# LaMain - design description (identical for every hand).
# This file is versioned with the CAD. No "magic" value should remain in the
# code: every calibration/speed/torque parameter comes from here.
#
# Units: positions in ticks (0-1023, 0.293 deg/step over 300 deg).

model_version: "lamain-v1"

bus:
  port: /dev/ttyACM0
  baudrate: 1000000
  servo_model: SCS0009

# Calibration order: thumb last, fingers extended and spread, to avoid a false
# stop caused by a collision.
calibration_order: [index_flex, middle_flex, index_middle_abd, thumb_rot, thumb_flex]

calibration:
  step_ticks: 2              # slow-approach step (2 steps ~= 0.6 deg)
  fast_step_ticks: 8         # fast-approach step (locating)
  stable_reads: 10           # N stable reads before suspecting a stop
  stable_epsilon_ticks: 3    # max variation allowed for "stable" (tolerate jitter)
  overrun_ticks: 20          # the command must lead the position by this much
  # Stop confirmation: approaching a stop, PUSH at max torque and dwell 2 s to
  # really feel it, then head to the other direction.
  probe_torque_pct: 100
  probe_max_s: 2.0
  torque_pct: 60             # sweep torque
  backoff_deg: 7             # back-off before each re-approach
  repeat: 1                  # number of slow measurements (median)
  settle_s: 0.02             # pause between two reads (real hardware)
  joint_timeout_s: 60        # max time per joint before aborting
  progress_every: 30         # print a progress line every N reads
  servo_end_margin_ticks: 40 # stop within X ticks of 0/1023 = "servo end"
  repeat_tolerance_ticks: 2  # beyond this => soft stop (status "uncertain")
  # Logical zero q=0: "middle" = midpoint of the two stops (symmetric both ways)
  # or "mount" = assembly zero (mount pose). "middle" is more robust when the
  # horn is mounted near a stop.
  reference_mode: middle

preconditions:
  min_voltage: 4.8
  max_voltage: 7.4
  warn_temperature: 50
  abort_temperature: 55

safety:
  home_margin_deg: 0         # end-of-travel margin (0 = go to the measured max)
  free_torque_pct: 20
  default_torque_pct: 40
  grasp_torque_pct: 80
  watchdog_timeout_s: 1.0
  max_step_deg_per_cycle: 10
  move_speed: 3              # rustypot speed step (0 = max, 1..6)

joints:
  # --- Crank: extension = dead center (extremum, not a stop) ---
  index_flex:
    servo_id: 1
    assembly_position: 511          # horn "up" at this position
    type: crank
    reference: dead_center_midpoint # midpoint of the two flexion stops
    branch: positive                # working direction (positive = close)
    nominal_travel_deg: 288         # travel measured on the bench (~20..1004 ticks)
    range_tolerance_deg: 15
    max_speed_dps: 120

  middle_flex:
    servo_id: 2
    assembly_position: 511
    type: crank
    reference: dead_center_midpoint
    branch: positive
    nominal_travel_deg: 288         # measured on the bench (to confirm with CAD)
    range_tolerance_deg: 15
    max_speed_dps: 120

  # --- Index+middle abduction: fingers together = stop ---
  index_middle_abd:
    servo_id: 3
    assembly_position: 511
    type: two_stop
    reference: hard_stop_min         # fingers together (to confirm with CAD)
    reference_side: auto             # side with the greatest reach
    branch: positive
    nominal_travel_deg: 210         # measured on the bench (to confirm with CAD)
    range_tolerance_deg: 15
    max_speed_dps: 120

  # --- Thumb base rotation: a stop on each side (to confirm with CAD) ---
  thumb_rot:
    servo_id: 4
    assembly_position: 300           # mount reflected at this position (not the 511 zero)
    type: two_stop
    reference: hard_stop_min         # most repeatable stop (to decide)
    reference_side: auto             # side with the greatest reach
    branch: positive
    nominal_travel_deg: 95          # measured on the bench (to confirm with CAD)
    range_tolerance_deg: 15
    max_speed_dps: 120

  # --- Thumb flexion: crank like ID 1 ---
  thumb_flex:
    servo_id: 5
    assembly_position: 511
    type: crank
    reference: dead_center_midpoint
    branch: positive
    nominal_travel_deg: 288         # measured on the bench (to confirm with CAD)
    range_tolerance_deg: 15
    max_speed_dps: 120
