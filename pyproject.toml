[project]
name = "lamain-workspace"
version = "0.1.0"
description = "Workspace for La Main (custom 5-dof robotic hand)."
requires-python = ">=3.12"
dependencies = ["lamain-core", "lamain-cli"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/lamain-core", "tools/lamain-cli"]

[tool.uv.sources]
lamain-core = { workspace = true }
lamain-cli = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
